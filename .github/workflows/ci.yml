name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the latest run per branch/PR matters; cancel older ones so private-repo
# macOS minutes (billed at 10x) aren't spent on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-14
    # The suite runs in ~2 minutes. A test that blocks the main thread (a modal
    # alert with nobody to dismiss it, say) otherwise sits until the 6-hour
    # ceiling — billed at the 10x macOS rate the whole way.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `test` is a REQUIRED status check, so this job must always run and report
      # — a paths-ignore trigger would leave the check pending forever and block
      # the merge. Instead detect whether anything the Swift suite can check
      # changed, and skip only the expensive swift steps when it didn't. Docs,
      # skills, hooks, scripts and ReproScript scenarios still get a green `test`
      # in seconds.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` = what `swift test` builds or reads, plus this workflow.
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/EdmundTests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'Resources/**'
              - '.github/workflows/ci.yml'

      - name: Skip note
        if: steps.filter.outputs.code != 'true'
        run: echo "No Swift, package or resource changes — skipping swift tests."

      # Package.swift declares swift-tools-version 6.0, which needs Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.filter.outputs.code == 'true'
        with:
          xcode-version: latest-stable

      - name: Swift version
        if: steps.filter.outputs.code == 'true'
        run: swift --version

      # Cache the SwiftPM build (deps + compiled objects) keyed on the resolved
      # dependency graph, so green runs don't recompile SwiftMath etc. each time.
      - name: Cache .build
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: .build
          # v2: the repo was renamed md -> Edmund, which changed the checkout
          # path and invalidated absolute paths baked into the cached module
          # cache. Bump this token to discard any pre-rename .build cache.
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Test
        if: steps.filter.outputs.code == 'true'
        run: swift test 2>&1 | tee test.log

      # Zero warnings in our own code. A grep rather than -warnings-as-errors:
      # -Xswiftc reaches the remote dependencies too. The fresh checkout gives
      # every source a new mtime, so all of ours recompile despite the .build
      # cache and every warning reaches the log.
      - name: No warnings
        if: steps.filter.outputs.code == 'true'
        run: |
          if grep -E '(Sources|Tests)/[^:]+:[0-9]+:[0-9]+: warning:' test.log | sort -u | grep .; then
            echo "::error::Compiler warnings in Sources/ or Tests/ (listed above). Fix them; the policy is zero."
            exit 1
          fi
