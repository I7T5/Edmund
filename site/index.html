<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edmund — a minimal, native Markdown editor for macOS</title>
<meta name="description" content="A minimal, native macOS Markdown editor with live preview. No vault — just your files. Open source.">
<style>
  :root { --accent: #ff6916; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1d1d1f; background: #fff;
    max-width: 40rem; margin: 0 auto; padding: 12vh 24px;
    line-height: 1.7; font-size: 1.05rem;
  }
  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 .25rem; }
  p { margin: 0 0 1.2rem; }
  .muted { color: #6e6e73; font-size: .95rem; }
  a { color: var(--accent); }
  nav a { margin-right: 1rem; }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; background: #0d0d0f; }
    .muted { color: #a1a1a6; }
  }
</style>
</head>
<body>
  <h1>Edmund</h1>
  <p>A minimal, native Markdown editor for macOS. Live preview, no vault — just your files.</p>

  <nav>
    <a href="https://github.com/I7T5/Edmund/releases/latest">Download</a>
    <a href="https://github.com/I7T5/Edmund">GitHub</a>
  </nav>

  <p class="muted" style="margin-top:2rem;">
    Free &amp; open source · macOS 14+ · Beta. Full site coming soon.
  </p>
</body>
</html>
