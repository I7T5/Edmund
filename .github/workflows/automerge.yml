name: Automerge Docs

# Docs/site-only PRs get their `test` check green in seconds (see ci.yml) and
# carry no code risk, so enable GitHub auto-merge on them. Auto-merge still waits
# for the required `test` check before merging — this just removes the manual
# click. Mixed PRs (docs + code) are left alone for human review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "site/**"
      - "misc/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same "did any code change?" gate as ci.yml, so a PR that also touches
      # code is NOT auto-merged even though it touched a doc file.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!misc/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Enable auto-merge
        if: steps.filter.outputs.code != 'true' && github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --merge "$PR"
